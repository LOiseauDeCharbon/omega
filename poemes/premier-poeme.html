    <p>
      Le poète qui se refuse<br>
    </p>
    À la culture<br>
    </p>
    De ce qui fut déjà fait auparavant dans l’art,<br>
    </p>
    Se promet de dériver dans son voyage ;<br>
    </p>
      <br>
    </p>
    Le poète qui se refuse<br>
    </p>
    À la lecture<br>
    </p>
    Du renouveau d’un horizon de poèmes,<br>
    </p>
    A, quant-à-lui, cessé de voyager.<br>
    </p>
      <br>
    </p>
    L’esprit humain et l’art du voyage<br>
